<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Anton&family=Inter:wght@200..600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff;font-family:Inter,sans-serif;font-weight:300;color:#000;overflow-x:hidden}a{color:#000;text-decoration:none}a:hover{color:#3f3f3f}@media (pointer:fine){body,body *{cursor:none!important}}@keyframes emerBlink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes emerDrip{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}</style>
<script src="./emer-db.js"></script>
</helmet>
<div style="background:#fff;color:#000;position:relative">

  <div style="position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 48px;box-sizing:border-box;transform:translateY({{ inY }});transition:transform 1.2s cubic-bezier(.65,0,.35,1);pointer-events:{{ inPE }}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;font:300 11px Inter;letter-spacing:.28em">
      <span>RASTREANDO MARCAS</span>
      <span>{{ inCount }}</span>
    </div>
  </div>

  <div style="position:fixed;inset:0;z-index:300;background:#fff;pointer-events:none;clip-path:{{ outClip }};transition:clip-path .9s cubic-bezier(.16,1,.3,1)"></div>

  <a ref="{{ entRef }}" href="Web.dc.html" onMouseEnter="{{ entIn }}" onMouseLeave="{{ entOut }}" style="position:fixed;right:48px;top:22px;z-index:210;isolation:isolate;display:flex;flex-direction:column;gap:7px;padding:6px 0;transform:translate({{ entX }},{{ entY }}) scale({{ entS }});transition:{{ entT }};visibility:{{ entV }}">
    <span style="position:absolute;left:-60px;right:-60px;top:-30px;bottom:-26px;z-index:-1;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 70%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 70%);opacity:{{ entHalo }};transition:opacity .8s cubic-bezier(.16,1,.3,1) .6s"></span>
    <span style="font:300 11px/1 Inter;letter-spacing:.28em;white-space:nowrap">[ SALTAR ]</span>
    <span style="height:1px;background:#000;transform:scaleX({{ entLine }});transform-origin:left;transition:transform .7s cubic-bezier(.16,1,.3,1)"></span>
  </a>

  <div style="position:fixed;left:0;right:0;top:0;height:2px;z-index:220;pointer-events:none">
    <div style="height:100%;background:#000;transform:scaleX({{ progS }});transform-origin:left"></div>
  </div>

  <section ref="{{ heroRef }}" data-screen-label="01 Hero" style="position:relative;height:460vh">
    <div style="position:sticky;top:0;height:100vh;overflow:hidden;transform:translateY({{ heroY }});transition:transform 1.2s cubic-bezier(.65,0,.35,1)">
      <sc-for list="{{ decos }}" as="d" hint-placeholder-count="0">
        <img src="{{ d.src }}" alt="" style="position:absolute;z-index:0;left:{{ d.x }};top:{{ d.y }};width:{{ d.w }};mix-blend-mode:multiply;transform:translate(-50%,-50%) translate({{ d.tx }},{{ d.ty }}) rotate({{ d.r }}) scale({{ d.s }});opacity:{{ d.o }};transition:{{ d.tr }};pointer-events:none">
      </sc-for>
      <img src="assets/deco/mujer.png" alt="" style="position:absolute;z-index:1;left:87%;bottom:0;height:min(68vh,58vw);mix-blend-mode:multiply;pointer-events:none;transform:translateX(-50%) translate({{ wmX }},{{ wmY }}) scale({{ wmS }});transform-origin:bottom center;opacity:{{ wmO }};transition:{{ wmT }}">
      <div style="position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:{{ wordO }}">
        <div style="display:flex;font:400 min(50vw,60vh)/0.8 'League Gothic';letter-spacing:0;-webkit-text-stroke:.042em #000;paint-order:stroke fill;transform:scale({{ wordS }});transform-origin:50% 55%">
          <sc-for list="{{ letters }}" as="l" hint-placeholder-count="4">
            <span style="display:block;overflow:hidden;padding:.05em .03em 0;margin:0 -.045em"><span style="display:block;transform:translateY({{ l.y }});transition:transform 1.3s cubic-bezier(.16,1,.3,1) {{ l.d }}">{{ l.c }}</span></span>
          </sc-for>
        </div>
      </div>
      <div style="position:absolute;left:50%;top:calc(50% + min(19vw,24vh) + 56px);z-index:3;transform:translateX(-50%);opacity:{{ autoO }};pointer-events:{{ autoPE }};transition:opacity .6s cubic-bezier(.16,1,.3,1)">
        <span onClick="{{ autoToggle }}" onMouseEnter="{{ autoIn }}" onMouseLeave="{{ autoOut }}" style="cursor:pointer;display:flex;flex-direction:column;gap:7px;padding:6px 0;font:300 11px/1 Inter;letter-spacing:.28em;white-space:nowrap">
          <span>{{ autoLblEl }}</span>
          <span style="height:1px;background:#000;transform:scaleX({{ autoLine }});transform-origin:left;transition:transform .7s cubic-bezier(.16,1,.3,1)"></span>
        </span>
      </div>
      <div style="position:absolute;left:48px;bottom:32px;z-index:3;font:300 11px Inter;letter-spacing:.28em;line-height:1.7;max-width:280px;opacity:{{ hintO }}">MARCAS EMERGENTES,<br>ANTES QUE NADIE.</div>
      <div style="position:absolute;left:50%;bottom:24px;z-index:3;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font:300 11px Inter;letter-spacing:.28em;padding-left:.28em;opacity:{{ hintO }}">BAJA<span style="width:1px;height:36px;position:relative;overflow:hidden">{{ dripEl }}</span></div>

      <sc-for list="{{ tunnel }}" as="t" hint-placeholder-count="0">
        <div style="position:absolute;z-index:4;left:50%;top:50%;width:14vw;aspect-ratio:3/4;overflow:hidden;background:#f3f3f1;transform:translate(-50%,-50%) translate({{ t.x }},{{ t.y }}) scale({{ t.s }});opacity:{{ t.o }}"><img src="{{ t.src }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
      </sc-for>
      <div style="position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;opacity:{{ cntO }};transform:translateY({{ cntY }})">
        <span style="font:400 30vw/0.8 'League Gothic';letter-spacing:-.02em;-webkit-text-stroke:.015em #000;text-shadow:0 0 30px rgba(255,255,255,.6)">{{ cntN }}</span>
        <span style="position:relative;isolation:isolate;padding:10px 0;font:300 12px Inter;letter-spacing:.3em;text-align:center;line-height:1.8;text-shadow:0 0 1px rgba(255,255,255,.9),0 0 8px rgba(255,255,255,.8)"><span style="position:absolute;left:-110px;right:-110px;top:-40px;bottom:-34px;z-index:-1;pointer-events:none;background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent),linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent),linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-composite:intersect"></span>MARCAS EMERGENTES<br>UN SOLO LUGAR</span>
      </div>
    </div>
  </section>

  <section ref="{{ maniRef }}" data-screen-label="02 Manifiesto" style="position:relative;height:340vh">
    <div style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 48px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;align-items:center;gap:.06em;font:400 min(6.4vw,11vh)/1.02 Anton;text-transform:uppercase;white-space:nowrap;opacity:{{ txtO }}">
        <sc-for list="{{ lines }}" as="ln" hint-placeholder-count="0">
          <div style="display:flex;align-items:center;gap:.26em">
            <sc-for list="{{ ln.items }}" as="w" hint-placeholder-count="0">
              <span style="display:inline-flex;align-items:center;opacity:{{ w.o }};transform:translateY({{ w.y }});transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)">{{ w.t }}<sc-if value="{{ w.isImg }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;height:.95em;width:1.9em;clip-path:{{ w.clip }};transition:clip-path 1s cubic-bezier(.16,1,.3,1)"><img src="{{ w.src }}" alt="" style="width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block"></span></sc-if></span>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <img src="assets/deco/bomba-policia.png" alt="" style="position:absolute;left:50%;top:50%;height:92vh;max-width:none;mix-blend-mode:multiply;pointer-events:none;transform:translate(-50%,-50%);opacity:{{ bigO }}">
      <span style="position:absolute;right:48px;bottom:32px;font:300 11px Inter;letter-spacing:.28em">{{ maniPct }}</span>
    </div>
  </section>

  <section ref="{{ exitRef }}" data-screen-label="03 Salida" style="position:relative;height:160vh">
    <div style="position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
      <span style="font:300 11px/1 Inter;letter-spacing:.28em;opacity:{{ exO }}">[ MARKETPLACE ]</span>
      <span style="width:140px;height:1px;background:#e2e2e2;position:relative;overflow:hidden;opacity:{{ exO }}"><span style="position:absolute;inset:0;background:#000;transform:scaleX({{ exS }});transform-origin:left"></span></span>
    </div>
  </section>

  <div id="emer-cur" style="position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:9999;display:none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { y: 0, vh: 800, vw: 1200, intro: 0, ready: false, auto: false, autoH: false, entH: false, ok: {}, ew: 100, eh: 24, leaving: false, tick: 0 };
  heroRef = React.createRef(); maniRef = React.createRef(); exitRef = React.createRef(); entRef = React.createRef();
  componentDidMount() {
    const t0 = performance.now();
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / 1800);
      this.setState({ intro: k });
      if (k < 1) this._ir = requestAnimationFrame(step); else setTimeout(() => this.setState({ ready: true }), 250);
    };
    this._ir = requestAnimationFrame(step);
    let raf = 0;
    this._sc = () => { if (raf) return; raf = requestAnimationFrame(() => {
      raf = 0; const e = this.entRef.current;
      this.setState({ measured: true, y: window.scrollY, vh: window.innerHeight, vw: window.innerWidth, ew: e ? e.offsetWidth : 100, eh: e ? e.offsetHeight : 24 });
      if (this.prog(this.exitRef) >= 0.99) this.leave();
    }); };
    window.addEventListener('scroll', this._sc, { passive: true });
    window.addEventListener('resize', this._sc);
    this._sc();
    this._stop = () => { if (this._autoOn) { this._autoOn = false; this.setState({ auto: false }); } };
    ['wheel', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, this._stop, { passive: true }));
    const chk = () => { (window.EMERDB.brands || []).forEach(b => { const im = new Image(); im.onload = () => this.setState(s => ({ ok: { ...s.ok, [b.id]: 1 } })); im.src = b.img; }); this.setState({ tick: 1 }); };
    if (window.EMERDB) chk(); else this._t = setInterval(() => { if (window.EMERDB) { clearInterval(this._t); chk(); } }, 60);
    this._mm = e => { const c = document.getElementById('emer-cur'); if (c && matchMedia('(pointer:fine)').matches) { c.style.display = 'block'; c.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; } };
    window.addEventListener('mousemove', this._mm);
  }
  leave() {
    if (this._left) return; this._left = true; this._autoOn = false;
    this.setState({ leaving: true, auto: false });
    setTimeout(() => { window.location.href = 'Web.dc.html'; }, 850);
  }
  startAuto() {
    const ex = this.exitRef.current; if (!ex) return;
    const target = ex.offsetTop + ex.offsetHeight - window.innerHeight, start = window.scrollY, dist = target - start;
    if (dist <= 0) return this.leave();
    this._autoOn = true; this.setState({ auto: true });
    const dur = Math.max(12000, dist / 0.4), t0 = performance.now();
    const step = now => {
      if (!this._autoOn) return;
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      window.scrollTo(0, start + dist * e);
      if (k < 1) this._ar = requestAnimationFrame(step); else this.leave();
    };
    this._ar = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    this._autoOn = false; cancelAnimationFrame(this._ir); cancelAnimationFrame(this._ar); clearInterval(this._t);
    window.removeEventListener('scroll', this._sc); window.removeEventListener('resize', this._sc); window.removeEventListener('mousemove', this._mm);
    ['wheel', 'touchstart', 'keydown'].forEach(ev => window.removeEventListener(ev, this._stop));
  }
  prog(ref) {
    const el = ref.current; if (!el) return 0;
    const h = el.offsetHeight - window.innerHeight;
    return Math.min(1, Math.max(0, (window.scrollY - el.offsetTop) / (h || 1)));
  }
  renderVals() {
    const D = window.EMERDB, st = this.state, BL = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    const cl = v => Math.min(1, Math.max(0, v)), io = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const products = D ? D.products : [], brandsD = D ? D.brands : [];
    const pA = this.prog(this.heroRef), pB = this.prog(this.maniRef), pC = this.prog(this.exitRef);
    const t1 = cl(pA / 0.36), e1 = io(t1), t2 = cl((pA - 0.28) / 0.64);
    const docH = document.documentElement.scrollHeight - st.vh;

    const S = 1.5, ex = -(st.vw / 2 - 48 - st.ew / 2), ey = st.vh / 2 - 22 - st.eh / 2;

    const DECO = [
      ['rally', 15, 26, 28, -1, -.6, -2], ['labios', 60, 10, 17, .4, -1, 5],
      ['estrellas-col', 3, 62, 6, -1, .3, -6], ['cerezas', 30, 78, 12, -.4, 1, 12],
      ['choque', 18, 92, 22, -.8, 1, -4], ['pistolera', 95, 36, 11, 1, -.3, 2], ['golondrinas-2', 90, 11, 8, .8, -1, 9], ['movil', 36, 16, 6, -.3, -1, -10],
    ];
    const decos = DECO.map(([n, x, y, w, dx, dy, r], i) => ({
      tr: 'none', src: `assets/deco/${n}.png`, x: x + '%', y: y + '%', w: w + 'vw', dl: `${300 + i * 140}ms`,
      tx: `${dx * e1 * 55}vw`, ty: `${dy * e1 * 50}vh`, r: `${r + e1 * r * 3}deg`, s: 1 + e1 * 0.7, o: 1 - cl(t1 / 0.28),
    }));
    const letters = [...'EMER'].map((c, i) => ({ c, y: '0%', d: '0ms' }));

    const bImg = b => st.ok[b.id] ? b.img : ((products.find(p => p.brand_id === b.id) || {}).main_image_url || BL);
    const pool = brandsD.length ? Array.from({ length: 12 }, (_, k) => bImg(brandsD[k % brandsD.length])) : [];
    const N = pool.length || 1;
    const tunnel = pool.map((src, k) => {
      const u = cl(t2 * 1.7 - (k / N) * 0.7), a = k * 2.3998, r = 15 + (k % 3) * 7;
      const s = 0.08 + Math.pow(u, 2.3) * 4.2;
      const o = u <= 0 ? 0 : u < 0.12 ? u / 0.12 : u > 0.8 ? 1 - (u - 0.8) / 0.2 : 1;
      return { src, x: `${Math.cos(a) * r * s}vw`, y: `${Math.sin(a) * r * 0.62 * s}vw`, s, o };
    });
    const cntIn = cl((pA - 0.28) / 0.08), cntOut = cl((pA - 0.9) / 0.08);

    const LINES = [['Rastreamos', '#ojo-grito'], ['las', 'mejores', 'marcas'], ['por', 'ti', '#manos'], ['Tu', 'cartera', 'se', 'encarga'], ['de', 'arder.']];
    const TOTAL = LINES.flat().length, tw = cl(pB / 0.62);
    let idx = 0;
    const lines = LINES.map(row => ({ items: row.map(t => {
      const on = tw * (TOTAL + 1) - 0.5 > idx++;
      if (t[0] === '#') return { t: '', isImg: true, src: `assets/deco/${t.slice(1)}.png`, clip: on ? 'inset(0 0 0 0)' : 'inset(0 100% 0 0)', o: 1, y: '0px' };
      return { t, isImg: false, src: BL, clip: 'none', o: on ? 1 : 0.1, y: on ? '0px' : '6px' };
    }) }));
    const big = pB > 0.66;

    const dripEl = React.createElement('span', { key: 'drip', style: { position: 'absolute', inset: 0, background: '#000', animation: st.ready ? 'emerDrip 2.2s cubic-bezier(.16,1,.3,1) infinite' : 'none', transform: 'scaleY(0)' } });

    const autoLblEl = React.createElement('span', { key: st.auto ? 'a1' : 'a0', style: { animation: st.auto ? 'none' : 'emerBlink .7s steps(1,end) infinite' } }, st.auto ? '[ DETENER ]' : '[ AUTOMÁTICO ]');
    return {
      autoLblEl, heroRef: this.heroRef, maniRef: this.maniRef, exitRef: this.exitRef, entRef: this.entRef, dripEl,
      inClip: st.ready ? 'inset(100% 0 0 0)' : 'inset(0 0 0 0)', inPE: st.ready ? 'none' : 'auto', inY: st.ready ? '-100vh' : '0px', heroY: st.ready ? '0px' : '100vh', outClip: st.leaving ? 'inset(0 0 0 0)' : 'inset(100% 0 0 0)',
      inCount: String(Math.round(st.intro * 100)).padStart(3, '0'),
      entT: st.ready ? 'transform 1.4s cubic-bezier(.16,1,.3,1)' : 'none', entV: st.measured ? 'visible' : 'hidden', entX: st.ready ? '0px' : `${ex}px`, entY: st.ready ? '0px' : `${ey}px`, entS: st.ready ? 1 : S, entHalo: st.ready ? 1 : 0, entLine: st.entH ? 1 : 0,
      entIn: () => this.setState({ entH: true }), entOut: () => this.setState({ entH: false }),
      progS: st.ready ? cl(st.y / (docH || 1)) : st.intro,
      decos, letters, wordS: 1 + Math.pow(e1, 2) * 11, wordO: 1 - cl((t1 - 0.55) / 0.3),
      hintO: 1 - cl(pA / 0.06),
      autoO: st.ready && (pA < 0.04 || st.auto) ? 1 : 0, autoPE: st.ready && pA < 0.04 ? 'auto' : 'none',
      autoLbl: st.auto ? '[ DETENER ]' : '[ AUTOMÁTICO ]', autoLine: st.autoH || st.auto ? 1 : 0,
      autoToggle: () => { if (this._autoOn) this._stop(); else this.startAuto(); },
      autoIn: () => this.setState({ autoH: true }), autoOut: () => this.setState({ autoH: false }),
      tunnel, cntN: String(Math.round(io(cl((pA - 0.28) / 0.5)) * 41)).padStart(2, '0'), cntO: cntIn * (1 - cntOut), cntY: `${(1 - cntIn) * 30 - cntOut * 40}px`,
      lines, txtO: big ? 0 : 1, bigO: big ? 1 : 0,
      wmT: 'none', wmO: 1 - cl(t1 / 0.28), wmX: `${e1 * 30}vw`, wmY: `${e1 * 20}vh`, wmS: 1 + e1 * 0.5,
      maniPct: String(Math.round(pB * 100)).padStart(3, '0'),
      exO: cl(pC * 3), exS: pC,
    };
  }
}
</script>
</body>
</html>
