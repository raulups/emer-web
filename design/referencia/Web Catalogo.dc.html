<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<script src="emer-data.js"></script>
<style>html,body{margin:0;background:#fff;color:#000;font-family:Fraunces,serif;-webkit-font-smoothing:antialiased}a{color:#000}a:hover{color:#3f3f3f}@keyframes emLine{0%{transform:scaleX(0);transform-origin:0 50%}50%{transform:scaleX(1);transform-origin:0 50%}50.01%{transform:scaleX(1);transform-origin:100% 50%}100%{transform:scaleX(0);transform-origin:100% 50%}}</style>
</helmet>
<section ref="{{ root }}" onMouseLeave="{{ leave }}" style="color:#000;position:relative;height:{{ secH }};min-height:560px;background:#000;display:flex;flex-direction:column;gap:1px;border-top:1px solid #000;border-bottom:1px solid #000;box-sizing:border-box;overflow:hidden">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
    <div style="flex:{{ r.flex }};min-height:{{ r.minH }};display:flex;gap:1px;transition:flex .85s cubic-bezier(.16,1,.3,1)">
      <sc-for list="{{ r.cells }}" as="t" hint-placeholder-count="5">
        <sc-if value="{{ t.isHead }}" hint-placeholder-val="{{ false }}">
          <div style="flex:{{ t.flex }};min-width:0;background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,1.6vw,24px);transition:flex .85s cubic-bezier(.16,1,.3,1)">
            <span style="font:300 9px Fraunces;letter-spacing:.3em;color:#666">CATÁLOGO</span>
            <div style="display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px)">
              <span style="font:400 clamp(40px,4.6vw,76px)/0.88 Anton;letter-spacing:.005em;display:flex;flex-direction:column"><span>TODAS LAS</span><span>MARCAS</span></span>
              <div onClick="{{ search }}" style="align-self:flex-start;display:flex;align-items:center;gap:14px;cursor:pointer;padding:6px 0">
                <span style="font:400 10px Fraunces;letter-spacing:.3em">BUSCAR</span>
                <span style="position:relative;width:40px;height:1px;overflow:hidden"><span style="position:absolute;inset:0;background:#000;animation:emLine 1.8s cubic-bezier(.65,0,.35,1) infinite"></span></span>
              </div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ t.isBrand }}" hint-placeholder-val="{{ true }}">
          <a data-tl="" href="{{ t.url }}" target="_blank" rel="noopener" onMouseEnter="{{ t.enter }}" style="flex:{{ t.flex }};min-width:0;position:relative;overflow:hidden;background:{{ t.shade }};color:#fff;text-decoration:none;cursor:pointer;transition:flex .85s cubic-bezier(.16,1,.3,1)">
            <div data-rvl="" style="position:absolute;inset:0;clip-path:inset(100% 0 0 0)">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;font:400 clamp(16px,1.6vw,26px)/1 Anton;color:transparent;-webkit-text-stroke:1px #c4c4c4;text-align:center">{{ t.name }}</div>
              <div style="position:absolute;inset:0;background-image:{{ t.bg }};background-size:cover;background-position:center;transform:scale({{ t.zoom }});filter:grayscale({{ t.gray }});transition:transform 1.4s cubic-bezier(.16,1,.3,1),filter .6s"></div>
              <sc-if value="{{ t.noImg }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;opacity:{{ t.lblOp }};transition:opacity .3s"><span style="font:400 clamp(22px,2.4vw,40px)/0.9 Anton;color:transparent;-webkit-text-stroke:1px #fff;text-align:center">{{ t.name }}</span></div>
              </sc-if>
              <div style="position:absolute;inset:0;background:rgba(0,0,0,{{ t.veil }});transition:background .6s cubic-bezier(.4,0,.2,1)"></div>
              <span style="position:absolute;left:10px;bottom:9px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 8px Fraunces;letter-spacing:.24em;mix-blend-mode:difference;opacity:{{ t.lblOp }};transition:opacity .3s">{{ t.name }}</span>
              <div style="position:absolute;left:clamp(14px,1.6vw,24px);right:clamp(14px,1.6vw,24px);bottom:clamp(14px,1.6vw,24px);display:flex;flex-direction:column;align-items:flex-start;gap:clamp(12px,1.4vw,20px);pointer-events:none">
                <div style="display:flex;gap:8px;width:100%">
                  <sc-for list="{{ t.prods }}" as="q" hint-placeholder-count="0">
                    <div style="flex:1 1 0px;min-width:0;max-width:96px;display:flex;flex-direction:column;gap:6px;opacity:{{ q.op }};transform:translateY({{ q.ty }});transition:opacity .5s {{ q.d }},transform .8s cubic-bezier(.16,1,.3,1) {{ q.d }}">
                      <div style="aspect-ratio:3/4;background-color:#ededed;background-image:{{ q.bg }};background-size:cover;background-position:center;border:1px solid #fff"></div>
                      <span style="font:400 9.5px Fraunces;letter-spacing:.06em;white-space:nowrap">{{ q.price }}</span>
                    </div>
                  </sc-for>
                </div>
                <div style="display:flex;flex-direction:column;gap:12px;min-width:0;max-width:100%">
                  <div style="overflow:hidden;max-width:100%"><span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 clamp(34px,3.6vw,64px)/0.95 Anton;letter-spacing:.005em;transform:translateY({{ t.ty }});transition:transform .8s cubic-bezier(.16,1,.3,1) .1s">{{ t.name }}</span></div>
                  <div style="display:flex;align-items:center;gap:12px;opacity:{{ t.ctaOp }};transition:opacity .45s .3s">
                    <span style="font:400 9px Fraunces;letter-spacing:.3em">VER MARCA</span>
                    <span style="position:relative;width:40px;height:1px;overflow:hidden"><span style="position:absolute;inset:0;background:#fff;animation:emLine 1.8s cubic-bezier(.65,0,.35,1) infinite"></span></span>
                  </div>
                </div>
              </div>
            </div>
          </a>
        </sc-if>
      </sc-for>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: 1200, ready: !!window.EMER, hv: -1 };
  root = React.createRef(); bad = new Set();

  componentDidMount() {
    const wait = () => { if (window.EMER) { this.setState({ ready: true }); [...EMER.BRANDS.map(b => b.img), ...EMER.PRODUCTS.map(p => p.img)].forEach(src => { if (!src) return; const im = new Image(); im.onerror = () => { this.bad.add(src); this.forceUpdate(); }; im.src = src; }); } else this.wt = setTimeout(wait, 60); };
    wait();
    this.onResize = () => { const w = document.documentElement.clientWidth || innerWidth; if (w !== this.state.w) this.setState({ w }); };
    this.onResize(); addEventListener('resize', this.onResize);
    const loop = () => { this.tick(); this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.wt); removeEventListener('resize', this.onResize); }

  tick() {
    const r = this.root.current; if (!r || this.revealed) return;
    const rr = r.getBoundingClientRect();
    if (rr.top < innerHeight * 0.75 && rr.bottom > 0) {
      this.revealed = true;
      [...r.querySelectorAll('[data-rvl]')].forEach((el, k) => { el.style.transition = `clip-path 1.1s cubic-bezier(.16,1,.3,1) ${80 + k * 45}ms`; el.style.clipPath = 'inset(0 0 0 0)'; });
    }
  }

  renderVals() {
    const s = this.state, url = u => u ? `url("${u}")` : 'none';
    const all = window.EMER ? EMER.BRANDS : [];
    const narrow = s.w < 760;
    const rnd = i => { const a = Math.sin((i + 1) * 91.17) * 43758.5453; return a - Math.floor(a); };
    const cells = [{ head: true }, ...all.map((b, i) => ({ b, i }))];
    const nR = narrow ? Math.ceil(cells.length / 2) : cells.length > 22 ? 4 : 3;
    const per = narrow ? cells.map(() => 2) : [0.9, 1.15, 0.85, 1.1].slice(0, nR);
    const counts = narrow ? Array(nR).fill(2) : (() => { const t = per.reduce((a, b) => a + b, 0); const c = per.map(p => Math.round(cells.length * p / t)); c[c.length - 1] += cells.length - c.reduce((a, b) => a + b, 0); return c; })();
    const hvRow = s.hv >= 0 ? this.rowOf : -1;
    let k = 0;
    const rows = counts.map((cnt, ri) => {
      const row = cells.slice(k, k + cnt); k += cnt;
      return {
        flex: narrow ? '0 0 auto' : (hvRow === ri ? '2.3 1 0px' : '1 1 0px'), minH: narrow ? '46vw' : '0px',
        cells: row.map((c, ci) => {
          const base = 0.8 + rnd(ri * 13 + ci) * 1.3;
          if (c.head) return { isHead: true, isBrand: false, flex: narrow ? '1 1 0px' : '0 0 clamp(260px,24vw,420px)' };
          const b = c.b, i = c.i, on = s.hv === i, dim = s.hv >= 0 && !on;
          const img = b.img && !this.bad.has(b.img) ? b.img : null;
          const pr = (b.preview || []).filter(p => p.img && !this.bad.has(p.img)).slice(0, 3);
          return { isHead: false, isBrand: true, url: b.url, name: b.upper, bg: url(img), noImg: !img, shade: '#f3f3f1',
            flex: `${on && !narrow ? base * Math.max(4, row.length * 0.75) : base} 1 0px`, zoom: on ? 1.05 : 1.12, gray: dim ? 1 : 0, veil: on ? 0.38 : dim ? 0.15 : 0, lblOp: on ? 0 : 1,
            ty: on ? '0%' : '105%', ctaOp: on ? 1 : 0,
            prods: narrow ? [] : pr.map((p, j) => ({ bg: url(p.img), price: p.priceLbl, op: on ? 1 : 0, ty: on ? '0px' : '24px', d: on ? `${380 + j * 90}ms` : '0ms' })),
            enter: () => { if (narrow) return; this.rowOf = ri; if (this.state.hv !== i) this.setState({ hv: i }); } };
        }),
      };
    });
    return {
      root: this.root, rows, secH: narrow ? 'auto' : '100vh',
      leave: () => this.setState({ hv: -1 }),
      search: () => { window.dispatchEvent(new CustomEvent('emer:search')); },
    };
  }
}
</script>
</body>
</html>
