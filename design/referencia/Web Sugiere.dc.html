<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#fff;color:#000;font-family:Fraunces,serif;-webkit-font-smoothing:antialiased}a{color:#000}a:hover{color:#3f3f3f}input{font:inherit;color:inherit}input::placeholder{color:#b5b4ae}@keyframes emLine{0%{transform:scaleX(0);transform-origin:0 50%}50%{transform:scaleX(1);transform-origin:0 50%}50.01%{transform:scaleX(1);transform-origin:100% 50%}100%{transform:scaleX(0);transform-origin:100% 50%}}@keyframes emWig{0%{translate:0 0;rotate:-2deg}50%{translate:2px -3px;rotate:2deg}100%{translate:-1px 1px;rotate:-1deg}}</style>
</helmet>
<section ref="{{ secRef }}" style="color:#000;position:relative;isolation:isolate;min-height:100vh;background:#fff;overflow:hidden;padding:clamp(120px,12vw,180px) clamp(16px,3vw,40px) clamp(160px,15vw,240px);box-sizing:border-box;display:flex;flex-direction:column;justify-content:center">
  <div style="position:absolute;inset:0;z-index:-1;background:#fff">
    <sc-for list="{{ decos }}" as="d" hint-placeholder-count="0">
      <div style="position:absolute;left:{{ d.l }};right:{{ d.rt }};top:{{ d.t }};bottom:{{ d.b }};width:{{ d.w }};aspect-ratio:{{ d.ar }};transform:translateY({{ d.ty }}) rotate({{ d.r }}) scale({{ d.sc }});transition:transform .9s cubic-bezier(.16,1,.3,1)">
        <div style="position:absolute;inset:0;background:url({{ d.src }}) {{ d.pos }}/{{ d.size }} no-repeat;mix-blend-mode:multiply;opacity:{{ d.gh }};transform:translate({{ d.gx }},{{ d.gy }});transition:opacity .6s,transform .9s cubic-bezier(.16,1,.3,1)"></div>
        <div style="position:absolute;inset:0;background:url({{ d.src }}) {{ d.pos }}/{{ d.size }} no-repeat;mix-blend-mode:multiply"></div>
      </div>
    </sc-for>
  </div>
  <div ref="{{ boxRef }}" style="width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(32px,4vw,56px);pointer-events:none">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:300 9px Fraunces;letter-spacing:.3em;color:#666">SUGIERE UNA MARCA</span>
      <span style="font:400 clamp(60px,9vw,150px)/0.86 Anton;letter-spacing:.005em;display:flex;flex-direction:column"><span>¿FALTA</span><span>ALGUNA?</span></span>
    </div>
    <sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
      <div style="pointer-events:auto;display:flex;flex-direction:column;gap:22px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px">
          <label style="display:flex;flex-direction:column;gap:8px;border-bottom:2px solid #000;padding-bottom:6px;cursor:text">
            <span style="font:400 8.5px Fraunces;letter-spacing:.26em;color:#666">NOMBRE DE LA MARCA</span>
            <input ref="{{ inRef }}" value="{{ name }}" onInput="{{ onName }}" onKeyDown="{{ onKey }}" maxlength="32" style="width:100%;border:0;outline:none;background:transparent;font:400 clamp(28px,3vw,42px)/1.1 Anton;text-transform:uppercase;padding:0"></input>
          </label>
          <label style="display:flex;flex-direction:column;gap:8px;border-bottom:2px solid #000;padding-bottom:6px;cursor:text">
            <span style="font:400 8.5px Fraunces;letter-spacing:.26em;color:#666">INSTAGRAM</span>
            <input value="{{ link }}" onInput="{{ onLink }}" onKeyDown="{{ onKey }}" maxlength="40" style="width:100%;border:0;outline:none;background:transparent;font:400 clamp(28px,3vw,42px)/1.1 Anton;padding:0"></input>
          </label>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
          <span style="font:300 italic 14px/1.5 Fraunces;color:#3f3f3f">Con uno de los dos nos basta.</span>
          <span onClick="{{ send }}" style="height:58px;padding:0 32px;display:flex;align-items:center;gap:18px;font:400 10px Fraunces;letter-spacing:.32em;cursor:pointer;background:{{ sendBg }};color:#fff;transition:background .35s,transform .2s" style-active="transform:scale(.97)">ENVIAR<span style="position:relative;width:44px;height:1px;overflow:hidden"><span style="position:absolute;inset:0;background:currentColor;animation:emLine 1.8s cubic-bezier(.65,0,.35,1) infinite"></span></span></span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="pointer-events:auto;position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:2px solid #000;padding:6px 0 14px">
        <span style="font:400 clamp(28px,3vw,42px)/1.1 Anton">{{ word }}</span>
        <span style="border:3px solid #000;padding:8px 16px;font:400 clamp(24px,2.4vw,34px)/1 Anton;letter-spacing:.04em;transform:rotate(-7deg) scale({{ stampSc }});opacity:{{ stampOp }};transition:transform .45s cubic-bezier(.34,1.56,.64,1) .2s,opacity .2s .2s">RECIBIDA</span>
        <span onClick="{{ again }}" style="width:100%;display:flex;align-items:center;gap:14px;cursor:pointer;font:400 10px Fraunces;letter-spacing:.3em;padding-top:6px">SUGERIR OTRA<span style="position:relative;width:40px;height:1px;overflow:hidden"><span style="position:absolute;inset:0;background:#000;animation:emLine 1.8s cubic-bezier(.65,0,.35,1) infinite"></span></span></span>
      </div>
    </sc-if>
    <div style="pointer-events:auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:clamp(20px,2.4vw,32px);border-top:1px solid #000">
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="font:400 9px Fraunces;letter-spacing:.3em">O CONTÁCTANOS</span>
        <span style="font:300 italic 14px Fraunces;color:#3f3f3f">Para cualquier otra cosa.</span>
      </div>
      <div style="display:flex;gap:12px">
        <a href="mailto:hola@emer.app" aria-label="Mail" style="width:56px;height:56px;border:1px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;background:#fff;transition:background .3s,color .3s" style-hover="background:#000;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14"></rect><path d="M3 6l9 7 9-7"></path></svg></a>
        <a href="https://instagram.com/" target="_blank" rel="noopener" aria-label="Instagram" style="width:56px;height:56px;border:1px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;background:#fff;transition:background .3s,color .3s" style-hover="background:#000;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"></circle></svg></a>
        <a href="https://x.com/" target="_blank" rel="noopener" aria-label="X" style="width:56px;height:56px;border:1px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;background:#fff;transition:background .3s,color .3s" style-hover="background:#000;color:#fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"></path></svg></a>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', link: '', sent: false, stamp: false, w: 1200, hd: -1 };
  inRef = React.createRef();
  IM = [['caballos', 2.6, 'center', 'cover', 20], ['grupo', 1.4, 'center', 'cover', 17], ['flores', 0.66, 'center', 'cover', 9], ['monos', 1.6, '45% 51%', '140% auto', 13], ['tabaco', 1, 'center', 'contain', 10], ['coche-lateral', 2.4, 'center', 'contain', 20]];
  secRef = React.createRef(); boxRef = React.createRef(); gridRef = React.createRef(); gmx = -9999; gmy = -9999; gk = 0;
  gridLoop(now) {
    const cv = this.gridRef.current, S = this.secRef.current; if (!cv || !S) return;
    const r = S.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    const dpr = Math.min(2, devicePixelRatio || 1), W = r.width, H = r.height;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const inside = this.gmx > r.left && this.gmx < r.right && this.gmy > r.top && this.gmy < r.bottom;
    this.gk += ((inside ? 1 : 0) - this.gk) * 0.05;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,.075)'; ctx.lineWidth = 1;
    const G = 56, mx = this.gmx - r.left, my = this.gmy - r.top, t = now / 1000, RAD = 260;
    const off = (x, y) => { const d = Math.hypot(x - mx, y - my), f = Math.exp(-(d * d) / (2 * RAD * RAD)) * this.gk; return Math.sin(d / 38 - t * 2.4) * 7 * f; };
    for (let y = 0; y <= H + G; y += G) { ctx.beginPath(); for (let x = 0; x <= W; x += 12) { const yy = y + off(x, y); x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke(); }
    for (let x = 0; x <= W + G; x += G) { ctx.beginPath(); for (let y = 0; y <= H; y += 12) { const xx = x + off(x, y); y ? ctx.lineTo(xx, y) : ctx.moveTo(xx, y); } ctx.stroke(); }
  }
  componentDidMount() {
    this.J = Array.from({ length: 11 }, () => [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5, 0.88 + Math.random() * 0.3]);
    this.onR = () => this.setState({ w: document.documentElement.clientWidth || innerWidth }); this.onR(); addEventListener('resize', this.onR);
    this.onPM = e => { this.gmx = e.clientX; this.gmy = e.clientY; }; addEventListener('pointermove', this.onPM);
  }
  componentWillUnmount() { clearTimeout(this.t1); removeEventListener('resize', this.onR); removeEventListener('pointermove', this.onPM); cancelAnimationFrame(this.graf); }
  submit() { const s = this.state; if (!s.name.trim() && !s.link.trim()) { this.inRef.current && this.inRef.current.focus(); return; } this.setState({ sent: true, stamp: false }); this.t1 = setTimeout(() => this.setState({ stamp: true }), 40); }
  renderVals() {
    const s = this.state, ok = s.name.trim() || s.link.trim();
    return {
      decos: (() => { if (!this.J) return [];
        const L = [['coche-lateral', 2.4, 'center', 'contain', { right: -6, bottom: -4 }, 40, 0], ['caballos', 2.6, 'center', 'cover', { left: 2, top: 3 }, 22, -3], ['grupo', 1.4, 'center', 'cover', { right: 3, top: 2 }, 16, 0], ['monos', 1.6, '45% 51%', '140% auto', { right: 30, top: 5 }, 9, -6], ['tabaco', 1, 'center', 'contain', { left: 4, bottom: 6 }, 13, -10], ['mecheros', 0.85, 'center', '150% auto', { left: 46, bottom: 3 }, 6, 8], ['moto', 0.9, 'center 70%', 'cover', { right: 6, top: 38 }, 12, 0], ['estrellas', 0.55, 'center', 'contain', { left: 38, top: 2 }, 4, 0], ['mano', 1, 'center', 'contain', { left: -2, top: 34 }, 12, -14]];
        const narrow = false, drop = [];
        return L.map((d, k) => [d, k]).filter(([d]) => !narrow || !drop.includes(d[0])).map(([d, k]) => { const J = this.J[k % this.J.length], p = d[4], on = false;
          return { src: 'assets/deco/' + d[0] + '.png', ar: d[1] + '/1', pos: d[2], size: d[3], w: (d[5] * J[3]) + 'vw',
            l: p.left != null ? (p.left + J[0] * 2) + 'vw' : 'auto', rt: p.right != null ? (p.right + J[0] * 2) + 'vw' : 'auto', t: p.top != null ? (p.top < 6 ? (12 + Math.abs(J[1]) * 16) + 'px' : (p.top + J[1] * 3) + '%') : 'auto', b: p.bottom != null ? p.bottom + '%' : 'auto',
            r: on ? '0deg' : (d[6] + J[2] * 6) + 'deg', ty: on ? '-10px' : '0px', sc: on ? 1.06 : 1, gh: on ? 0.35 : 0, gx: on ? '12px' : '0px', gy: on ? '9px' : '0px',
            enter: () => this.setState({ hd: k }), leave: () => { if (this.state.hd === k) this.setState({ hd: -1 }); } }; }); })(), secRef: this.secRef, gridRef: this.gridRef, boxRef: this.boxRef, editing: !s.sent, sent: s.sent, name: s.name, link: s.link, inRef: this.inRef, word: (s.name.trim() || s.link.trim()).toUpperCase(),
      onName: e => this.setState({ name: e.target.value }), onLink: e => this.setState({ link: e.target.value }),
      onKey: e => { if (e.key === 'Enter') this.submit(); }, send: () => this.submit(),
      sendBg: ok ? '#000' : '#9a9a9a', stampSc: s.stamp ? 1 : 2.4, stampOp: s.stamp ? 1 : 0,
      again: () => this.setState({ sent: false, stamp: false, name: '', link: '' }, () => setTimeout(() => this.inRef.current && this.inRef.current.focus(), 50)),
    };
  }
}
</script>
</body>
</html>
